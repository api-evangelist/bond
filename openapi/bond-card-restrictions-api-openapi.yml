                          minLength: 1
                          example: '2020-06-29T14:59:38.386930'
                        date_updated:
                          type: string
                          minLength: 1
                          example: '2020-06-29T14:59:38.386930'
                      required:
                      - uuid
                      - card_id
                      - restriction_type
                      - max_amount
                      - date_created
                      - date_updated
                required:
                - card
                - restrictions
