      summary: Resume a Persona Inquiry
      description: Obtain a new `session_token` for resuming a Persona inquiry. This is required if the Persona inquiry, inquiry session, or `session_token` has expired. This can also be used if the `session_token` has been lost.
      operationId: post_resume_payload
      tags:
      - KYC
  /customers/{customer_id}/verification-kyc:
    parameters:
    - name: customer_id
      in: path
      required: true
      schema:
        type: string
    post:
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: ''
                type: object
                x-examples:
                  example-1:
                    customer_id: 2df10ec1-130f-41bb-b0cf-f3af48350eb7
                    kyc_status: submitted
                properties:
                  customer_id:
                    type: string
                    minLength: 1
                    example: 2df10ec1-130f-41bb-b0cf-f3af48350eb7
                    readOnly: true
                  kyc_status:
                    type: string
                    minLength: 1
                    example: submitted
                    readOnly: true
                required:
                - customer_id
                - kyc_status
              examples:
                example:
                  value:
                    customer_id: 2df10ec1-130f-41bb-b0cf-f3af48350eb7
                    kyc_status: submitted
      summary: Start KYC (Know-Your-Customer)
      description: Start a KYC verification for a `Customer`
      operationId: post_verification_kyc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCPostPayload'
        required: true
      tags:
      - KYC
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                passed:
                  value:
                    customer_id: d856bf10-d4a6-4153-b8f8-2b93072dd8da
                    brand_id: ce027c9c-39c6-47f4-a12d-abb543f7cf63
                    kyc_status: passed
                document_required:
                  value:
                    customer_id: d856bf10-d4a6-4153-b8f8-2b93072dd8da
                    brand_id: ce027c9c-39c6-47f4-a12d-abb543f7cf63
                    kyc_status: document_required
                    documents:
                    - document_type: proof_of_address
                      status: required
                      upload_link: https://sample.link
      summary: Retrieve KYC Status
      description: Retrieve the KYC status of a `Customer`
      operationId: get_verification_kyc
      tags:
      - KYC
components:
  schemas:
    KYCPostPayload:
      type: object
      description: ''
      title: ''
      properties:
        program_id:
          type: string
          description: String in acceptable UUID format that corresponds to a valid `Program` program_id.
          example: 72585109-8222-4221-b15b-48e87ffed790
        ssn:
          type: string
          description: 'Must be in ######### or ###-##-#### format'
          example: 741-55-7293
        phone:
          type: string
          description: Numbers only or dash-separated are acceptable
          example: 555-111-2222
        phone_country_code:
          type: string
          description: Must be a string of 1-3 digits
          example: '1'
        email:
          type: string
          description: Must be a valid email address
          example: james@mi6.gov.uk
        dob:
          type: string
          description: Birthday in YYYY-MM-DD format.
          example: '1997-12-25'
        ip:
          type: string
          description: '<b><sup>Conditionally required based on program configuration</sup></b>

            Must be dot separated'
          example: 24.54.101.22
      required:
      - program_id
  securitySchemes:
    identity:
      type: apiKey
      in: header
      name: Identity
    authorization:
      type: apiKey
      in: header
      name: Authorization
