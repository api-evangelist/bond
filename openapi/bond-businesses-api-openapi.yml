          example: 0-50
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        beneficial_owners:
          type: array
          items:
            $ref: '#/components/schemas/BeneficialOwnerPostSerializer'
      required:
      - legal_business_name
