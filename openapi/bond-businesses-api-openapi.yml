openapi: 3.2.0
info:
  title: Businesses API
  description: Businesses
  version: '0'
servers:
- url: https://sandbox.bond.tech/api/v0
security:
- identity: []
  authorization: []
tags:
- name: Businesses
paths:
  /businesses:
    get:
      tags:
      - Businesses
      summary: Retrieve all businesses
      description: Retrieves all businesses associated with a brand
      operationId: get_businesses
      parameters:
      - name: page
        in: query
        description: page number requested to return
        schema:
          type: integer
          default: 1
          exclusiveMinimum: 0
      - name: count
        in: query
        description: number of Business information in response
        schema:
          type: integer
      - name: brand_business_id
        in: query
        description: Return businesses that match the brand_business_id
        schema:
          type:
          - string
          - 'null'
          example: ac6ee2d3-5a03-4043-a4aa-dda51836b9fd
      responses:
        '200':
          $ref: '#/components/responses/paginated-business-response'
    post:
      tags:
      - Businesses
      summary: Create a business
      description: Creates a business associated with a brand
      operationId: post_businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessesPostSerializer'
        required: true
      responses:
        '201':
          $ref: '#/components/responses/Business-response-write'
  /businesses/{business_id}:
    get:
      tags:
      - Businesses
      summary: Retrieve a business
      description: Retrieves a business associated with a brand
      operationId: get_business
      parameters:
      - name: business_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Business-response'
    delete:
      tags:
      - Businesses
      summary: Delete a business
      description: Deletes a business associated with a brand
      operationId: delete_business
      parameters:
      - name: business_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
    patch:
      tags:
      - Businesses
      summary: Update a business
      description: Updates a business associated with a brand
      operationId: patch_business
      parameters:
      - name: business_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessesPatchSerializer'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Business-response-write'
components:
  schemas:
    BusinessesGetSerializer:
      type: object
      description: ''
      properties:
        business_id:
          minLength: 1
          type: string
        brand_business_id:
          minLength: 1
          type: string
        ein:
          minLength: 1
          type: string
        phone:
          minLength: 1
          type: string
        email:
          minLength: 1
          type: string
        website:
          minLength: 1
          type: string
        legal_business_name:
          minLength: 1
          type: string
        dba_business_name:
          minLength: 1
          type: string
        business_type:
          minLength: 1
          type: string
        date_updated:
          minLength: 1
          type: string
        date_created:
          minLength: 1
          type: string
        industry_type:
          minLength: 1
          type: string
        number_of_employees:
          minLength: 1
          type: string
        addresses:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/AddressGet'
        beneficial_owners:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BeneficialOwnerGetSerializer'
      required:
      - business_id
      - ein
      - phone
      - email
      - website
      - legal_business_name
      - dba_business_name
      - business_type
      - date_updated
      - date_created
      - industry_type
      - number_of_employees
      - addresses
      - beneficial_owners
    BeneficialOwnerGetSerializer:
      type: object
      properties:
        dob:
          type: string
          description: Date of birth in YYYY-MM-DD format.
          format: string
          example: '1980-04-04'
        first_name:
          type: string
          description: First name.<br />Has a 1 to 20-character limit. Must start with an alphabet and may only contain alphabets, spaces, and apostrophes.
          example: John
        middle_name:
          type: string
          description: Middle name.<br />Has a 20-character limit. Must start with an alphabet and may only contain alphabets, spaces, and apostrophes.
          example: O'Shea
        last_name:
          type: string
          description: Last name.<br />Has a 2 to 20-character limit. Must start with an alphabet and may only contain alphabets, spaces, and apostrophes.
          example: Doe
        date_created:
          type: string
        date_updated:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressGet'
      required:
      - first_name
      - last_name
      - addresses
      x-examples:
        example-1:
          dob: '1980-04-04'
          first_name: John
          middle_name: O'Shea
          last_name: Doe
          addresses:
          - address_type: MAILING
            street: 345 California Ave.
            street2: Suit 600
            city: San Francisco
            state: CA
            zip_code: 12345-1234
            country: US
            is_primary: true
    AddressGet:
      type: object
      properties:
        address_id:
          type: string
          description: String in UUID format corresponds to address address_id of related customer_id
        address_type:
          type: string
          description: 'Address type is one of the following : MAILING, PHYSICAL, REGISTERED'
          enum:
          - MAILING
          - PHYSICAL
          - REGISTERED
        street:
          type: string
          description: 'Has a 1 to 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: 345 California Ave.
        street2:
          type: string
          description: 'Has a 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: Suit 600
        city:
          type: string
          description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
          example: San Francisco
          minLength: 2
          maxLength: 40
        state:
          type: string
          description: Has a 2-character limit for US address.<br />Has a 20-character limit for non US address.
          example: CA
        zip_code:
          type: string
          description: zip code in 5-digit (12345) or 9-digit (12345-1234) format for US address.<br />Has a 2 to 20-character limit for non US address.
          example: 12345-1234
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.<br />Has a 2-character limit.
          example: US
        is_primary:
          type: boolean
          description: Is Primary Address?
          example: true
        date_created:
          type: string
        date_updated:
          type: string
      required:
      - address_id
    BeneficialOwnerPostSerializer:
      type: object
      properties:
        dob:
          type: string
          description: Date of birth in YYYY-MM-DD format.
          format: string
          example: '1980-04-04'
        first_name:
          type: string
          description: First name.<br />Has a 1 to 20-character limit. Must start with an alphabet and may only contain alphabets, spaces, and apostrophes.
          example: John
        middle_name:
          type: string
          description: Middle name.<br />Has a 20-character limit. Must start with an alphabet and may only contain alphabets, spaces, and apostrophes.
          example: O'Shea
        last_name:
          type: string
          description: Last name.<br />Has a 2 to 20-character limit. Must start with an alphabet and may only contain alphabets, spaces, and apostrophes.
          example: Doe
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
      - first_name
      - last_name
      - addresses
      x-examples:
        example-1:
          dob: '1980-04-04'
          first_name: John
          middle_name: O'Shea
          last_name: Doe
          addresses:
          - address_type: MAILING
            street: 345 California Ave.
            street2: Suit 600
            city: San Francisco
            state: CA
            zip_code: 12345-1234
            country: US
            is_primary: true
    Address:
      title: ''
      type: object
      properties:
        address_type:
          type: string
          description: 'Address type is one of the following : MAILING, PHYSICAL, REGISTERED'
          enum:
          - MAILING
          - PHYSICAL
          - REGISTERED
        street:
          type: string
          description: 'Has a 1 to 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: 345 California Ave.
        street2:
          type: string
          description: 'Has a 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: Suit 600
        city:
          type: string
          description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
          example: San Francisco
          minLength: 2
          maxLength: 40
        state:
          type: string
          description: Has a 2-character limit for US address.<br />Has a 20-character limit for non US address.
          example: CA
        zip_code:
          type: string
          description: zip code in 5-digit (12345) or 9-digit (12345-1234) format for US address.<br />Has a 2 to 20-character limit for non US address.
          example: 12345-1234
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.<br />Has a 2-character limit.
          example: US
        is_primary:
          type: boolean
          description: Is Primary Address?
          example: true
      required:
      - address_type
      - street
      - city
      - state
      - zip_code
      - country
      - is_primary
    BusinessesPatchSerializer:
      title: ''
      type: object
      properties:
        brand_business_id:
          type: string
          description: The brand's UUID for the business.
          example: ac6ee2d3-5a03-4043-a4aa-dda51836b9fd
        ein:
          type: string
          description: The Tax Identification Number
          example: 12-1234567
        legal_business_name:
          type: string
          description: The legal business name
          example: John Doe Business Corporation
        dba_business_name:
          type: string
          description: The doing-business-as name (trade name)
          example: John's
        business_type:
          type: string
          description: The business type
          example: cooperative
          enum:
          - cooperative
          - limited_liability_company
          - sole_proprietorship
          - partnership
          - limited_partnership
          - corporation
          - nonprofit_organization
        date_established:
          type: string
          description: Date of incorporation in YYYY-MM-DD format
          format: string
          example: '2020-01-01T00:00:00.000Z'
        phone:
          type: string
          description: Phone number
          example: '+14157485052'
        email:
          type: string
          description: Business contact email
          example: info@business.com
        website:
          type: string
          description: The official website
          example: www.business.com
        industry_type:
          type: string
          description: Type of business conducted
          example: Financial
        number_of_employees:
          type: string
          description: Description of number of employees at firm, as a range or value
          example: 0-50
    BusinessesPostSerializer:
      type: object
      properties:
        brand_business_id:
          type: string
          description: The brand's UUID for the business.
          example: ac6ee2d3-5a03-4043-a4aa-dda51836b9fd
        ein:
          type: string
          description: The Tax Identification Number
          example: 12-1234567
        legal_business_name:
          type: string
          description: The legal business name
          example: John Doe Business Corporation
        dba_business_name:
          type: string
          description: The doing-business-as name (trade name)
          example: John's
        business_type:
          type: string
          description: The business type
          example: cooperative
          enum:
          - cooperative
          - limited_liability_company
          - sole_proprietorship
          - partnership
          - limited_partnership
          - corporation
          - nonprofit_organization
        date_established:
          type: string
          description: Date of incorporation in YYYY-MM-DD format
          format: string
          example: '2020-01-01T00:00:00.000Z'
        phone:
          type: string
          description: Phone number
          example: '+14157485052'
        email:
          type: string
