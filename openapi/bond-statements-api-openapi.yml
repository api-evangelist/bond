      x-examples:
        credit-account:
          credit_limit: 1000
          security_deposit_account_id: 3abc7efb-5827-48bb-8931-be6fe08f905c
      title: account-credit
      properties:
        credit_limit:
          type: integer
          example: 1000
          readOnly: true
        security_deposit_account_id:
          type:
          - string
          - 'null'
          example: 46352399-d005-451a-b988-27b8c878503e
          readOnly: true
    statement:
      x-examples:
        credit statement:
          statement_id: 1b8c7986-bd5a-4923-9d62-fe3a3671f891
          account_id: 654dc482-96f9-4012-b2e3-fb73a5a17c97
          statement_month: 2022-02
          type: credit
          statement_start_date: '2022-01-21'
          statement_end_date: '2022-02-20'
          fees: 0
          transactions:
            transaction_date: '2022-02-13'
            settled_date: '2022-02-13'
            amount: 1458
            transaction_description: atm fee
            transaction_type: Purchase
          credit:
            payment_due_date: '2022-03-15'
            previous_balance: 78515
            new_balance: 850
            available_credit: 150
            credit_limit: 1000
            minimum_payment_due: 35
            interest_charged: 0
            purchases: 850
            payments_and_credits: 247
      allOf:
      - type: object
        properties:
          statement_id:
            type: string
            example: 1b8c7986-bd5a-4923-9d62-fe3a3671f891
          account_id:
            type: string
            example: 654dc482-96f9-4012-b2e3-fb73a5a17c97
            description: uuid of account
          statement_month:
            type: string
            example: 2022-02
          type:
            type: string
            enum:
            - credit
            - deposit
          statement_start_date:
            type: string
            example: '2022-01-29'
          statement_end_date:
            type: string
            example: '2022-02-28'
          fees:
            type: integer
          transactions:
            type: array
            items:
              type: object
              properties:
                transaction_date:
                  type: string
                  example: '2022-01-30'
                settled_date:
                  type: string
                  example: '2022-01-30'
                amount:
                  type: integer
                transaction_description:
                  type: string
                transaction_type:
                  type: string
                  enum:
                  - Fee
                  - Refund
                  - Payment
                  - Purchase
                  - Interest
              required:
              - transaction_date
              - settled_date
              - amount
              - transaction_description
              - transaction_type
        required:
        - statement_id
        - statement_month
        - type
        - statement_start_date
        - statement_end_date
        - fees
        - transactions
      - oneOf:
        - type: object
          properties:
            deposit:
              $ref: '#/components/schemas/account-deposit'
        - type: object
          properties:
            credit:
              $ref: '#/components/schemas/account-credit'
  securitySchemes:
    identity:
      type: apiKey
      in: header
      name: Identity
    authorization:
      type: apiKey
      in: header
      name: Authorization
