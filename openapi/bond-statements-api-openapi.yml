openapi: 3.2.0
info:
  title: Accounts Statements API
  version: '0.1'
  description: ''
servers:
- url: https://sandbox.bond.tech/api/v0.1
security:
- identity: []
  authorization: []
tags:
- name: Statements
paths:
  /accounts/{account_id}/statements:
    parameters:
    - schema:
        type: string
      name: account_id
      in: path
      required: true
    get:
      summary: Get all statements for an account
      tags:
      - Statements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/statement'
              examples:
                credit:
                  value:
                    page: 1
                    pages: 1
                    count: 1
                    next_page: 0
                    data:
                    - statement_id: c11fc6d8-9865-45b7-b3de-583257abe33e
                      statement_month: 2022-02
                      type: credit
                      statement_start_date: '2022-01-21'
                      statement_end_date: '2022-02-20'
                      fees: 0
                      transactions:
                        transaction_date: '2022-02-13'
                        settled_date: '2022-02-13'
                        amount: 1458
                        transaction_description: Amazon LLC
                        transaction_type: Purchase
                      credit:
                        payment_due_date: '2022-03-15'
                        previous_balance: 78515
                        new_balance: 850
                        available_credit: 150
                        credit_limit: 1000
                        minimum_payment_due: 35
                        interest_charged: 0
                        purchases: 850
                        payments_and_credits: 247
                deposit:
                  value:
                    page: 1
                    pages: 1
                    count: 1
                    next_page: 0
                    data:
                    - statement_id: c11fc6d8-9865-45b7-b3de-583257abe33e
                      statement_month: 2022-02
                      type: deposit
                      statement_start_date: '2022-01-21'
                      statement_end_date: '2022-02-20'
                      fees: 0
                      transactions:
                        transaction_date: '2022-02-13'
                        settled_date: '2022-02-13'
                        amount: 1458
                        transaction_description: atm fee
                        transaction_type: Fee
                      deposit:
                        beginning_balance: 1000057
                        withdrawals: 20057
                        deposits: 325000
                        ending_balance: 1305000
      operationId: get-statements
      parameters:
      - schema:
          type: string
          example: 1b8c7986-bd5a-4923-9d62-fe3a3671f891
        in: query
        name: starting_after
      - schema:
          type: string
          example: 1b8c7986-bd5a-4923-9d62-fe3a3671f891
        in: query
        name: ending_before
      - schema:
          type: string
          example: '10'
        in: query
        name: limit
      description: Get all statements
  /accounts/{account_id}/statements/{yyyy}/{mm}:
    parameters:
    - schema:
        type: string
      name: account_id
      in: path
      required: true
      description: account id for statement
    - schema:
        type: string
      name: yyyy
      in: path
      required: true
      description: year for desired statement
    - schema:
        type: string
      name: mm
      in: path
      required: true
      description: month for desired statement
    get:
      summary: Get a statement for an account
      tags:
      - Statements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statement'
              examples:
                deposit statement:
                  value:
                    statement_id: c11fc6d8-9865-45b7-b3de-583257abe33e
                    account_id: 654dc482-96f9-4012-b2e3-fb73a5a17c97
                    statement_month: 2022-02
                    type: deposit
                    statement_start_date: '2022-01-21'
                    statement_end_date: '2022-02-20'
                    fees: 0
                    transactions:
                      transaction_date: '2022-02-13'
                      settled_date: '2022-02-13'
                      amount: 1458
                      transaction_description: atm fee
                      transaction_type: Fee
                    deposit:
                      beginning_balance: 1000057
                      withdrawals: 20057
                      deposits: 325000
                      ending_balance: 1305000
                credit statement:
                  value:
                    statement_id: 38677cf1-6f3f-4c5b-96dc-77d0bc724eda
                    account_id: 654dc482-96f9-4012-b2e3-fb73a5a17c97
                    statement_month: 2022-02
                    type: credit
                    statement_start_date: '2022-01-21'
                    statement_end_date: '2022-02-20'
                    fees: 0
                    transactions:
                      transaction_date: '2022-02-13'
                      settled_date: '2022-02-13'
                      amount: 1458
                      transaction_description: Amazon LLC
                      transaction_type: Purchase
                    credit:
                      payment_due_date: '2022-03-15'
                      previous_balance: 78515
                      new_balance: 850
                      available_credit: 150
                      credit_limit: 1000
                      minimum_payment_due: 35
                      interest_charged: 0
                      purchases: 850
                      payments_and_credits: 247
      operationId: get-statements-yyyy-mm
      description: Get a statement by Year and Month
components:
  schemas:
