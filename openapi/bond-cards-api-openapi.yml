tags:
- name: Cards
paths:
  /cards:
    post:
      summary: Create a card
      description: Creates a new card and card account
      operationId: post_cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/card-write-post'
            examples:
              Create Card:
                value:
                  account_id: 1c667427-5521-4ffd-ac59-16ab73dc133e
                  card_design_id: '12'
                  card_mailing_address:
                    street: 345 California St.
                    street2: Suite 600
                    city: San Francisco
                    state: CA
                    zip_code: 94104
        required: true
      tags:
      - Cards
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/card'
              examples:
                card response:
                  value:
                    card_id: 057c6074-a02d-4a5a-bad9-bbc64b047df7
                    date_updated: '2020-08-16T19:39:34Z'
                    date_created: '2020-08-15T19:39:34Z'
                    customer_id: c8940088-21e8-451c-987c-0a0398db3ee5
                    account_id: 26bdeb70-157c-4c44-a04a-3727793b9779
                    expiry_date: tok_live_7g3eARzeEBJw89rJRCHqHv
                    last_four: '6270'
                    card_number: tok_live_q7kwTYb5YCYznpgRHHTs9p
                    cvv: tok_live_c94od3AsFWYQ1ecaaMYtFU
                    status: active
                    card_design_id: null
    get:
      summary: Retrieve all cards
      operationId: get_cards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  page:
                    type: integer
                  pages:
                    type: integer
                  count:
                    type: integer
                  has_more:
                    type: boolean
                  cards:
                    type: array
                    uniqueItems: true
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/card'
                required:
                - page
                - pages
                - count
                - cards
              examples:
                example:
                  value:
                    page: 1
                    pages: 1
                    count: 5
                    has_more: false
                    cards:
                    - card_id: 057c6074-a02d-4a5a-bad9-bbc64b047df7
                      date_updated: '2020-08-16T19:39:34Z'
                      date_created: '2020-08-15T19:39:34Z'
                      customer_id: c8940088-21e8-451c-987c-0a0398db3ee5
                      account_id: 26bdeb70-157c-4c44-a04a-3727793b9779
                      expiry_date: tok_live_7g3eARzeEBJw89rJRCHqHv
                      last_four: '6270'
                      card_number: tok_live_q7kwTYb5YCYznpgRHHTs9p
                      cvv: tok_live_c94od3AsFWYQ1ecaaMYtFU
                      status: active
                      card_design_id: null
      description: Get all cards.
      parameters:
      - schema:
          type: string
        in: query
        name: customer_id
        description: UUID (36 characters)
      - schema:
          type: string
        in: query
        name: business_id
        description: UUID (36 characters)
      - schema:
          type: string
        in: query
        name: show_closed
        description: 'Possible values: true/false. Default false'
      - description: Page number
        required: false
        schema:
          title: Page
          type: integer
          description: Page number
          default: 1
        name: page
        in: query
      - description: Items per page
        required: false
        schema:
          title: Count
          type: integer
          description: Items per page
          default: 10
        name: count
        in: query
      - schema:
          type: string
        in: query
        name: order_by
        description: 'By date created. Possible values: desc/asc'
      tags:
      - Cards
  /cards/{card_id}:
    parameters:
    - name: card_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a card
      description: Retrieves info about a card
      operationId: get_cards_id
      tags:
