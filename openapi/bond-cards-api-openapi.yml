                    expiry_date: tok_live_7g3eARzeEBJw89rJRCHqHv
                    last_four: '6270'
                    card_number: tok_live_q7kwTYb5YCYznpgRHHTs9p
                    cvv: tok_live_c94od3AsFWYQ1ecaaMYtFU
                    status: active
                    card_design_id: null
      description: Updates info about a card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/card-write-patch'
            examples:
              example:
                value:
                  status: active
      tags:
      - Cards
  /cards/{card_id}/activate:
    parameters:
