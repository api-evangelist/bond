                    status: active
                    card_design_id: null
      tags:
      - Cards
      description: Activate a card
  /cards/{card_id}/close:
    parameters:
    - name: card_id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Close a Card
      operationId: post_cards_close
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/card'
              examples:
                Card Closed:
                  value:
                    card_id: 057c6074-a02d-4a5a-bad9-bbc64b047df7
                    date_updated: '2020-08-16T19:39:34Z'
