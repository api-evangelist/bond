components:
  schemas:
    address-write:
      type: object
      description: ''
      title: Address-write
      x-examples:
        example:
          street: 345 California Ave.
          street2: Suite 600
          city: San Francisco
          state: CA
          zip_code: 12345
          country: US
      properties:
        street:
          type: string
          description: 'Has a 1 to 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: 345 California Ave.
        street2:
          type: string
          description: 'Has a 40-character limit, inclusive. Must start with an alphanumeric, and may only contain alphanumerics and the special characters `. , _ - #`'
          example: Suite 600
        city:
          type: string
          description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
          example: San Francisco
          minLength: 2
          maxLength: 40
        state:
          type: string
          description: Has a 2-character limit for US address.<br />Has a 20-character limit for non US address.
          example: CA
        zip_code:
          type: string
          description: zip code in 5-digit (12345) or 9-digit (12345-1234) format for US address.<br />Has a 2 to 20-character limit for non US address.
          example: 12345-1234
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.<br />Has a 2-character limit.
          example: US
      required:
      - street
      - city
      - state
      - zip_code
      - country
    card-write-post:
      type: object
      x-examples:
        card:
          account_id: 1c667427-5521-4ffd-ac59-16ab73dc133e
          card_design_id: '12'
          card_mailing_address:
            street: 345 California St.
            street2: Suite 600
            city: San Francisco
            state: CA
            zip_code: 94104
      title: card-write-post
      description: POST
      properties:
        account_id:
          type: string
          example: 1c667427-5521-4ffd-ac59-16ab73dc133e
          description: account_id for which the card will be associated to
        credit_limit:
          type: string
          example: '100.00'
          description: credit_limit for the card. Provide only when creating commercial secured cards.
        card_design_id:
          type: string
          example: '12'
          description: 'The visual design of card.

            Please contact Support to start creating card designs.'
        card_mailing_address:
          $ref: '#/components/schemas/address-write'
      required:
      - account_id
    card:
      description: ''
