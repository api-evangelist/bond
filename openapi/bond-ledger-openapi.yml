                    amount: '5.30'
                    currency: USD
                    created_time: '2021-02-02T22:27:13+00:00'
                    updated_time: '2021-03-02T20:39:56+00:00'
                    details:
                      card_id: 71efc729-830f-455f-9525-281c19bb4bb4
