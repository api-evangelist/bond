paths:
  /transactions:
    get:
      tags:
      - Transactions
      summary: Get transactions
      description: Get all transactions available to a brand with pagination and optional filtering.
      operationId: get_transactions
      parameters:
      - required: false
        schema:
          title: Customer Id
          type: string
          format: uuid
        name: customer_id
        in: query
        description: UUID (36 characters)
      - required: false
        schema:
          title: Account Id
          type: string
          format: uuid
        name: account_id
        in: query
        description: UUID (36 characters)
      - schema:
          type: string
        name: payment_type
        in: query
        description: '`ach` `card` or `account`'
      - required: false
        schema:
          title: Start Date
          type: string
          format: date
        name: start_date
        in: query
        description: '`YYYY-MM-DD` format'
      - required: false
        schema:
          title: End Date
          type: string
          format: date
        name: end_date
        in: query
        description: '`YYYY-MM-DD` format'
      - description: Page number
        required: false
        schema:
          title: Page
          type: integer
          description: Page number
          default: 1
        name: page
        in: query
      - description: Items per page
        required: false
        schema:
          title: Count
          type: integer
          description: Items per page
          default: 10
        name: count
        in: query
      - schema:
          type: string
        in: query
        name: order_by
        description: 'possible values: desc/asc'
      - schema:
          type: string
        in: query
        name: transaction_state
        description: '`failed` `declined` `pending` `cancelled` `completed` `returned`'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'
              examples:
                example:
                  value:
                    page: 1
                    pages: 1
                    count: 1
                    next_page: 0
                    transactions:
                    - transaction_id: 0fec1e58-b197-4052-99cf-2218496c5482
                      bond_brand_id: 9bfee014-1774-4b22-941c-b188c7f3d2e1
                      customer_id: 160c0c4b-9966-4dc1-a916-8407eb10d74e
                      account_id: 449e7a5c-69d3-4b8a-aaaf-5c9b713ebc65
                      payment_type: card
                      transaction_type: POS Purchase
                      previous_transaction_id: 2c61460f-e4af-48d9-b027-e2612f09e376
                      state: completed
                      amount: '306.00'
                      currency: USD
                      created_time: '2019-08-24T14:15:22Z'
                      updated_time: '2019-08-24T14:15:22Z'
                      details:
                        card_id: 66f6e46c-f6a1-4af8-a1bd-49666bc01304
                        external_account_id: bf68a995-67db-4b76-88a8-1ca00e9bbd80
                        class_code: string
                        direction: string
                        network: string
                        description: string
                        failure_reason: string
                        return_code: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /transactions/{transaction_id}:
    get:
      tags:
      - Transactions
      summary: Get a transaction by id
      description: Get details for a single transaction.
      operationId: get_transaction_id
      parameters:
      - required: true
        schema:
          title: Transaction Id
          type: string
          format: uuid
        name: transaction_id
        in: path
        description: UUID (36 characters)
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSchema'
              examples:
                example:
                  value:
                    transaction_id: b9b8da9a-5ff2-4e5c-84ee-587b7d092f6b
                    bond_brand_id: 8ed5c9fe-581b-490a-9dcb-3302db235a4b
