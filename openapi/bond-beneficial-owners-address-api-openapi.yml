components:
  schemas:
    Address:
      title: ''
      type: object
      properties:
        address_type:
          type: string
          description: 'Address type is one of the following : MAILING, PHYSICAL, REGISTERED'
          enum:
          - MAILING
          - PHYSICAL
          - REGISTERED
        street:
          type: string
          description: 'Has a 1 to 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: 345 California Ave.
        street2:
          type: string
          description: 'Has a 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: Suit 600
        city:
          type: string
          description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
          example: San Francisco
          minLength: 2
          maxLength: 40
        state:
          type: string
          description: Has a 2-character limit for US address.<br />Has a 20-character limit for non US address.
          example: CA
        zip_code:
          type: string
          description: zip code in 5-digit (12345) or 9-digit (12345-1234) format for US address.<br />Has a 2 to 20-character limit for non US address.
          example: 12345-1234
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.<br />Has a 2-character limit.
          example: US
        is_primary:
          type: boolean
          description: Is Primary Address?
          example: true
      required:
      - address_type
      - street
      - city
      - state
      - zip_code
      - country
      - is_primary
    BeneficialOwnerAddressPatchSerializer:
      type: object
      properties:
        address_type:
          type: string
          description: 'Address type is one of the following : MAILING, PHYSICAL'
          enum:
          - MAILING
          - PHYSICAL
        street:
          type: string
          description: 'Has a 1 to 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: 345 California Ave.
        street2:
          type: string
          description: 'Has a 40-character limit. May only contain alphanumerics and the special characters `. , _ - #`'
          example: Suit 600
        city:
          type: string
          description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
          example: San Francisco
          minLength: 2
          maxLength: 40
        state:
          type: string
          description: Has a 2-character limit for US address.<br />Has a 20-character limit for non US address.
          example: CA
        zip_code:
          type: string
          description: zip code in 5-digit (12345) or 9-digit (12345-1234) format for US address.<br />Has a 2 to 20-character limit for non US address.
          example: 12345-1234
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.<br />Has a 2-character limit.
          example: US
        is_primary:
          type: boolean
          description: Is Primary Address?
          example: true
  responses:
    Business-address:
      description: Example response
      content:
        application/json:
          schema:
            description: ''
            type: object
            properties:
              date_created:
                type: string
                minLength: 1
              address_id:
                type: string
                minLength: 1
              address_type:
                type: string
                minLength: 1
              street:
                type: string
                minLength: 1
                maxLength: 40
              street2:
                type: string
                maxLength: 40
              city:
                type: string
                minLength: 1
                description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
              state:
                type: string
                minLength: 1
              zip_code:
                type: string
                minLength: 1
              country:
                type: string
                minLength: 1
              is_primary:
                type: boolean
            required:
            - date_created
            - address_id
            - address_type
            - street
            - street2
            - city
            - state
            - zip_code
            - country
            - is_primary
          examples:
            example:
              value:
                date_created: '2019-08-24T14:15:22Z'
                address_id: 12348579-5d05-4e3e-a5e3-e61e3a5b1234
                address_type: MAILING
                street: 345 California Ave.
                street2: Suit 600
                city: San Francisco
                state: CA
                zip_code: 12345-1234
                country: US
                is_primary: true
    Business-address-write:
      description: Example response
      content:
        application/json:
          schema:
            description: ''
            type: object
            properties:
              address_type:
                type: string
                minLength: 1
              street:
                type: string
                minLength: 1
                maxLength: 40
              street2:
                type: string
                maxLength: 40
              city:
                type: string
                minLength: 2
                maxLength: 40
                description: Has a 2 to 40-character limit. May contain only alphanumerics, `-`, `_`,`.`, and spaces
              state:
                type: string
                minLength: 1
              zip_code:
                type: string
                minLength: 1
              country:
                type: string
                minLength: 1
              is_primary:
                type: boolean
            required:
            - address_type
            - street
            - street2
            - city
            - state
            - zip_code
            - country
            - is_primary
          examples:
            example:
              value:
                address_type: MAILING
                street: 345 California Ave.
                street2: Suit 600
                city: San Francisco
                state: CA
                zip_code: 12345-1234
                country: US
                is_primary: true
  securitySchemes:
    identity:
      type: apiKey
      name: Identity
      in: header
    authorization:
      type: apiKey
      name: Authorization
      in: header
