paths:
  /businesses/{business_id}/beneficial_owners/{beneficial_owner_id}/addresses:
    get:
      tags:
      - Beneficial owners address
      summary: Retrieve all beneficial owner addresses
      description: Retrieves all addresses associated with a beneficial owner
      operationId: get_beneficial_owner_addresses
      parameters:
      - name: business_id
        in: path
        required: true
        schema:
          type: string
      - name: beneficial_owner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              examples:
                example:
                  value:
                    page_info:
                      page_size: 2
                      page: 1
                      pages: 1
                    data:
                    - date_created: '2019-08-24T14:15:22.000Z'
