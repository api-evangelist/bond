    url: https://docs.bond.tech/docs/transactions-overview
- aid: bond:bond-credit-api
  name: Bond Credit API
  description: >-
    Open and service credit accounts for credit-builder and secured charge card programs — submit credit
    applications, surface credit-account data to customers, handle instant funding for credit-builder
    cards, and manage adverse-action notices required under United States fair-lending regulation. Documented
    as a distinct product area alongside Bond's deposit and card offerings within the embedded-finance
    platform.
  humanURL: https://docs.bond.tech/docs/opening-a-credit-account
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Credit
  - Credit Builder
  - Secured Cards
  - Lending
  - Compliance
  properties:
