apis:
- aid: bond:bond-customers-kyc-api
  name: Bond Customers & KYC API
  description: >-
    Create, retrieve, update, and delete individual consumer customer resources for a brand and run Know-Your-Customer
    (KYC) identity verification against them. Endpoints start and retrieve KYC status, resume Persona
    inquiries with fresh session tokens, and manage customer addresses. This is the identity foundation
    every downstream account, card, and transfer flow builds on in Bond's United States banking-as-a-service
    platform.
  humanURL: https://docs.bond.tech/reference/get_customers
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Customers
  - Identity Verification
  - KYC
  - Onboarding
  - Banking as a Service
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_customers
  - type: Documentation
    url: https://docs.bond.tech/docs/customer-onboarding
  - type: Authentication
    url: authentication/bond-authentication.yml
- aid: bond:bond-businesses-kyb-api
  name: Bond Businesses & KYB API
  description: >-
    Manage commercial customer entities for embedded business banking — create and update businesses,
    business addresses, and beneficial owners with their addresses, then run Know-Your-Business (KYB)
    and beneficial-owner KYC verification (v1 and v2 KYB, plus resume flows). Supports the full commercial
    onboarding and compliance path required to open business deposit and card accounts in the United States.
  humanURL: https://docs.bond.tech/reference/get_businesses
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Business
  - KYB
  - Beneficial Owners
  - Compliance
  - Commercial Banking
  tags_raw:
  - United States
  - Businesses
  - KYB
  - Beneficial Owners
  - Compliance
  - Commercial Banking
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_businesses
  - type: Documentation
    url: https://docs.bond.tech/docs/business-onboarding-overview
- aid: bond:bond-cards-api
  name: Bond Cards API
  description: >-
    Issue and manage physical, virtual, debit, secured charge, and credit-builder cards. Create cards
    and card accounts, retrieve and update card details, reissue and activate physical cards, close cards,
    and set and manage card restrictions such as maximum transaction amounts. A companion card-management
    web SDK handles PCI-scoped rendering of card numbers and PIN set/reset without the sensitive data
    touching your servers.
  humanURL: https://docs.bond.tech/reference/get_cards
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Cards
  - Card Issuing
  - Virtual Cards
  - PCI
  - Embedded Finance
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_cards
  - type: Documentation
    url: https://docs.bond.tech/docs/manage-card
  - type: SDK
    url: https://docs.bond.tech/docs/web-sdk-documentation
- aid: bond:bond-accounts-statements-api
  name: Bond Accounts & Statements API
  description: >-
    Open and manage consumer and commercial deposit accounts, credit accounts, and security-deposit accounts,
    with documented account types, account states, and account lifecycle management. Generate and retrieve
    deposit-account and credit-account statements for customers. These flows sit on top of Bond's pre-integrated
    partner-bank relationships and back the consumer and commercial banking products brands build in the
    United States.
  humanURL: https://docs.bond.tech/docs/account-overview
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Account
  - Deposit Accounts
