  - type: Documentation
    url: https://docs.bond.tech/docs/webhook
  - type: Webhooks
    url: asyncapi/bond-webhooks.yml
- aid: bond:bond-simulation-api
  name: Bond Simulation (Sandbox) API
  description: >-
    Sandbox-only endpoints for deterministically testing banking flows before going live — simulate a
    card transaction authorization, simulate transaction settlement, and force KYC pass or fail outcomes,
    plus documented triggers for KYC and KYB scenarios such as document-request and rejection paths. Lets
    United States fintech developers exercise the full lifecycle without touching real money or real identity
    providers.
  humanURL: https://docs.bond.tech/reference/post_authorization
  baseURL: https://sandbox.bond.tech/api/v0.1/
  tags:
  - United States
