  - type: DeclineCodes
    url: errors/bond-ach-return-codes.yml
- aid: bond:bond-ledger-transactions-api
  name: Bond Ledger (Transactions) API
  description: >-
    Retrieve all transactions available to a brand with pagination and optional filtering, and fetch details
    for a single transaction by id. Documents the transaction lifecycle and states, payment types, transaction
    types, response payload references, and MCC (merchant category) codes so brands can present accurate,
    real-time ledger and spend data to their United States banking customers.
  humanURL: https://docs.bond.tech/reference/get_transactions
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
