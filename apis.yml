  - type: Documentation
    url: https://docs.bond.tech/docs/statements-1
- aid: bond:bond-transfers-api
  name: Bond Transfers API
  description: >-
    Move money between accounts with ACH transfers and account-to-account fund transfers, and link and
    manage external bank accounts using Plaid before initiating transfers. Documents the ACH transfer
    model, funding of security-deposit accounts, external-account linking and removal, and the complete
    set of ACH return codes brands must handle in the United States payments environment.
  humanURL: https://docs.bond.tech/docs/account-transfers
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Transfers
  - Money Movement
