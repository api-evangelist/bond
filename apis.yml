    url: https://docs.bond.tech/docs/opening-a-credit-account
  - type: Documentation
    url: https://docs.bond.tech/docs/credit-builder-card-overview
- aid: bond:bond-webhooks-api
  name: Bond Webhooks API
  description: >-
    Subscribe to and manage webhook event notifications so applications react in real time to KYC/KYB
    status changes, card events, transactions, and account activity. Create, retrieve, update, and delete
    webhook subscriptions, choose the events you receive, verify inbound request signatures, and test
    delivery in the sandbox. This is the event backbone for Bond's asynchronous banking workflows in the
    United States.
  humanURL: https://docs.bond.tech/reference/get_webhooks
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Webhook
