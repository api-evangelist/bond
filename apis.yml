apis:
- aid: bond:bond-customers-kyc-api
  name: Bond Customers & KYC API
  description: >-
    Create, retrieve, update, and delete individual consumer customer resources
    for a brand and run Know-Your-Customer (KYC) identity verification against
    them. Endpoints start and retrieve KYC status, resume Persona inquiries with
    fresh session tokens, and manage customer addresses. This is the identity
    foundation every downstream account, card, and transfer flow builds on in
    Bond's United States banking-as-a-service platform.
  humanURL: https://docs.bond.tech/reference/get_customers
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Customers
  - Identity Verification
  - KYC
  - Onboarding
  - Banking as a Service
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_customers
  - type: Documentation
    url: https://docs.bond.tech/docs/customer-onboarding
  - type: Authentication
    url: authentication/bond-authentication.yml
- aid: bond:bond-businesses-kyb-api
  name: Bond Businesses & KYB API
  description: >-
    Manage commercial customer entities for embedded business banking — create
    and update businesses, business addresses, and beneficial owners with their
    addresses, then run Know-Your-Business (KYB) and beneficial-owner KYC
    verification (v1 and v2 KYB, plus resume flows). Supports the full commercial
    onboarding and compliance path required to open business deposit and card
    accounts in the United States.
  humanURL: https://docs.bond.tech/reference/get_businesses
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Businesses
  - KYB
  - Beneficial Owners
  - Compliance
  - Commercial Banking
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_businesses
  - type: Documentation
    url: https://docs.bond.tech/docs/business-onboarding-overview
- aid: bond:bond-cards-api
  name: Bond Cards API
  description: >-
    Issue and manage physical, virtual, debit, secured charge, and credit-builder
    cards. Create cards and card accounts, retrieve and update card details,
    reissue and activate physical cards, close cards, and set and manage card
    restrictions such as maximum transaction amounts. A companion card-management
    web SDK handles PCI-scoped rendering of card numbers and PIN set/reset without
    the sensitive data touching your servers.
  humanURL: https://docs.bond.tech/reference/get_cards
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Cards
  - Card Issuing
  - Virtual Cards
  - PCI
  - Embedded Finance
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_cards
  - type: Documentation
    url: https://docs.bond.tech/docs/manage-card
  - type: SDK
    url: https://docs.bond.tech/docs/web-sdk-documentation
- aid: bond:bond-accounts-statements-api
  name: Bond Accounts & Statements API
  description: >-
    Open and manage consumer and commercial deposit accounts, credit accounts,
    and security-deposit accounts, with documented account types, account states,
    and account lifecycle management. Generate and retrieve deposit-account and
    credit-account statements for customers. These flows sit on top of Bond's
    pre-integrated partner-bank relationships and back the consumer and commercial
    banking products brands build in the United States.
  humanURL: https://docs.bond.tech/docs/account-overview
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Accounts
  - Deposit Accounts
  - Statements
  - Banking as a Service
  - Commercial Banking
  properties:
  - type: Documentation
    url: https://docs.bond.tech/docs/account-overview
  - type: Documentation
    url: https://docs.bond.tech/docs/statements-1
- aid: bond:bond-transfers-api
  name: Bond Transfers API
  description: >-
    Move money between accounts with ACH transfers and account-to-account fund
    transfers, and link and manage external bank accounts using Plaid before
    initiating transfers. Documents the ACH transfer model, funding of
    security-deposit accounts, external-account linking and removal, and the
    complete set of ACH return codes brands must handle in the United States
    payments environment.
  humanURL: https://docs.bond.tech/docs/account-transfers
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Transfers
  - Money Movement
  - ACH
  - Plaid
  - Payments
  properties:
  - type: Documentation
    url: https://docs.bond.tech/docs/account-transfers
  - type: Documentation
    url: https://docs.bond.tech/docs/ach-transfers
  - type: DeclineCodes
    url: errors/bond-ach-return-codes.yml
- aid: bond:bond-ledger-transactions-api
  name: Bond Ledger (Transactions) API
  description: >-
    Retrieve all transactions available to a brand with pagination and optional
    filtering, and fetch details for a single transaction by id. Documents the
    transaction lifecycle and states, payment types, transaction types, response
    payload references, and MCC (merchant category) codes so brands can present
    accurate, real-time ledger and spend data to their United States banking
    customers.
  humanURL: https://docs.bond.tech/reference/get_transactions
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Transactions
  - Ledger
  - Payments
  - Reporting
  - Embedded Finance
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_transactions
  - type: Documentation
    url: https://docs.bond.tech/docs/transactions-overview
- aid: bond:bond-credit-api
  name: Bond Credit API
  description: >-
    Open and service credit accounts for credit-builder and secured charge card
    programs — submit credit applications, surface credit-account data to
    customers, handle instant funding for credit-builder cards, and manage
    adverse-action notices required under United States fair-lending regulation.
    Documented as a distinct product area alongside Bond's deposit and card
    offerings within the embedded-finance platform.
  humanURL: https://docs.bond.tech/docs/opening-a-credit-account
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Credit
  - Credit Builder
  - Secured Cards
  - Lending
  - Compliance
  properties:
  - type: Documentation
    url: https://docs.bond.tech/docs/opening-a-credit-account
  - type: Documentation
    url: https://docs.bond.tech/docs/credit-builder-card-overview
- aid: bond:bond-webhooks-api
  name: Bond Webhooks API
  description: >-
    Subscribe to and manage webhook event notifications so applications react in
    real time to KYC/KYB status changes, card events, transactions, and account
    activity. Create, retrieve, update, and delete webhook subscriptions, choose
    the events you receive, verify inbound request signatures, and test delivery
    in the sandbox. This is the event backbone for Bond's asynchronous banking
    workflows in the United States.
  humanURL: https://docs.bond.tech/reference/get_webhooks
  baseURL: https://api.bond.tech/api/v0.1/
  tags:
  - United States
  - Webhooks
  - Events
  - Notifications
  - Real Time
  - Integration
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/get_webhooks
  - type: Documentation
    url: https://docs.bond.tech/docs/webhook
  - type: Webhooks
    url: asyncapi/bond-webhooks.yml
- aid: bond:bond-simulation-api
  name: Bond Simulation (Sandbox) API
  description: >-
    Sandbox-only endpoints for deterministically testing banking flows before
    going live — simulate a card transaction authorization, simulate transaction
    settlement, and force KYC pass or fail outcomes, plus documented triggers for
    KYC and KYB scenarios such as document-request and rejection paths. Lets
    United States fintech developers exercise the full lifecycle without touching
    real money or real identity providers.
  humanURL: https://docs.bond.tech/reference/post_authorization
  baseURL: https://sandbox.bond.tech/api/v0.1/
  tags:
  - United States
  - Sandbox
  - Simulation
  - Testing
  - Developer Experience
  - Banking as a Service
  properties:
  - type: APIReference
    url: https://docs.bond.tech/reference/post_authorization
  - type: Documentation
    url: https://docs.bond.tech/docs/sandbox-vs-production
  - type: Sandbox
    url: sandbox/bond-sandbox.yml
