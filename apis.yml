aid: bond
name: Bond
kind: company
description: >-
  Bond Financial Technologies is an enterprise-grade banking-as-a-service (BaaS)
  and embedded finance platform that lets software companies and fintechs embed
  financial products directly into their applications through a single REST API.
  The platform covers consumer and commercial deposit accounts, credit-builder
  and secured charge cards, debit and virtual card issuing and management, money
  movement (ACH and account-to-account transfers, external-account linking via
  Plaid), a transaction ledger, statements, identity verification (KYC, KYB, and
  beneficial-owner verification powered by Persona), webhook event subscriptions,
  and a full sandbox with simulation endpoints for authorizations, settlements,
  and KYC/KYB scenarios. Bond exposes API-key authenticated endpoints under
  api.bond.tech with pre-integrated bank partnerships. Bond was acquired by FIS
  in June 2023; its developer documentation remains live at docs.bond.tech.
  Surfaced originally as a portfolio company of Canaan Partners and enriched here
  from Bond's public developer documentation.
